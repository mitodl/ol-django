---
name: CI
on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-24.04
    name: Check for required changelogs
    if: ${{ !contains(github.event.head_commit.author, 'renovate') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch all history
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Install dependencies
      run: uv sync

    - name: Changelog
      run: uv run scripts/changelog.py check

      # A version bump merged to main is what publishes a release, so the
      # declarations that feed it have to agree before it lands.
    - name: Versions
      run: uv run scripts/version.py check


  tests:
    runs-on: ubuntu-24.04
    name: Python tests (Python ${{ matrix.python-version}}, Django ${{ matrix.django-version
      }})
    strategy:
      matrix:
        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
        django-version:
        - "4.2"
        - "5.0"
        - "5.1"
        - "5.2"
        exclude:
        - python-version: "3.13"
          django-version: "4.2"
        - python-version: "3.13"
          django-version: "5.0"

    # Service containers to run
    services:
      postgres:
        image: postgres@sha256:78481659c47e862334611ccdaf7c369c986b3046da9857112f3b309114a65fb4
        env:
          POSTGRES_PASSWORD: postgres
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
        - 5432:5432

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0   # fetch all history
        persist-credentials: false

    - name: Apt update
      run: sudo apt-get update

    - name: Apt install
      run: sudo apt-get install -y libxmlsec1-dev

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Pin python-version ${{ matrix.python-version }}
      run: uv python pin ${{ matrix.python-version }}

    - name: Install tox
      run: uv tool install tox --with tox-uv

    - name: Install dependencies
      run: uv sync

    - name: Tests
      env:
        TOXENV: 'py${{ matrix.python-version }}-django${{ matrix.django-version }}'

      run: |
        TOXENV=${TOXENV//.} # replace all dots
        tox

      # - name: Upload coverage to CodeCov
      #   uses: codecov/codecov-action@v1
      #   with:
      #     directory: ${{ matrix.app-name }}/coverage/
      #     flags: ${{ matrix.app-name }}

  # A release is a version change landing on main: once the checks above pass,
  # every package whose pyproject.toml version is not yet on PyPI is built,
  # published with Trusted Publishing, and tagged.
  #
  # PyPI, not the git tag history, decides what counts as already released.
  # This repo has published versions that were never tagged, so a tag-based
  # check would try to republish them.
  detect-releases:
    needs: [changelog, tests]
    name: Detect unpublished versions
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      found: ${{ steps.detect.outputs.found }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Install dependencies
      run: uv sync

    - name: Detect
      id: detect
      run: |
        matrix="$(uv run scripts/publish.py matrix)"
        count="$(printf '%s' "$matrix" | jq '.include | length')"

        printf '%s' "$matrix" | jq .
        echo "Packages to publish: ${count}"

        {
          echo "matrix<<MATRIX_EOF"
          printf '%s\n' "$matrix"
          echo "MATRIX_EOF"
        } >> "$GITHUB_OUTPUT"

        if [ "$count" -eq 0 ]; then
          echo "found=false" >> "$GITHUB_OUTPUT"
        else
          echo "found=true" >> "$GITHUB_OUTPUT"
        fi

  publish:
    needs: detect-releases
    name: Publish ${{ matrix.package }} ${{ matrix.version }}
    runs-on: ubuntu-24.04
    if: needs.detect-releases.outputs.found == 'true'
    environment: pypi
    permissions:
      contents: write   # create the release tag
      id-token: write   # PyPI Trusted Publishing
    # Serialize releases so two overlapping pushes cannot both decide the same
    # version is unpublished and race each other to upload it.
    concurrency:
      group: publish-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-releases.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: false

    # Build by PyPI project name rather than by directory: mitol-drf-lint does
    # not follow the mitol-django-<dir> convention the other packages share.
    - name: Build
      env:
        PACKAGE: ${{ matrix.package }}
      run: uv build --package "$PACKAGE" --out-dir dist

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: dist
        # Tolerate a version that reached PyPI after this run's detect step.
        skip-existing: true

    # Tagging last means a tag always records something that really reached
    # PyPI, instead of being left behind by a failed build or upload.
    - name: Tag the release
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        SHA: ${{ github.sha }}
        TAG: ${{ matrix.tag }}
      run: |
        if gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
          echo "Tag ${TAG} already exists."
          exit 0
        fi

        # The package is already on PyPI by this point, and detect-releases
        # will not select it again, so a re-run cannot create a missed tag.
        # Retry rather than leave the release permanently untagged.
        for remaining in 2 1 0; do
          if gh api "repos/${REPOSITORY}/git/refs" \
            --raw-field "ref=refs/tags/${TAG}" \
            --raw-field "sha=${SHA}" \
            --silent; then
            exit 0
          fi

          if [ "$remaining" -eq 0 ]; then
            echo "::error::Published ${TAG} but could not create the tag." \
              "Create it with: git tag ${TAG} ${SHA} && git push origin ${TAG}"
            exit 1
          fi

          sleep 5
        done
