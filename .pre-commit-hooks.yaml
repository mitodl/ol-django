---
- id: drf-serializer-orm-check
  name: DRF Serializer ORM Check
  description: "Detects Django ORM queries inside DRF serializer methods (N+1 risk)"
  entry: drf-lint
  language: python
  files: "serializers\\.py$"
  # The checker builds one project-wide index per invocation, so parallel
  # invocations would each build their own.
  require_serial: true
  additional_dependencies:
  - mitol-drf-lint
