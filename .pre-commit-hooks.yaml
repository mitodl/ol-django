---
- id: drf-serializer-orm-check
  name: DRF Serializer ORM Check
  description: "Detects Django ORM queries inside DRF serializer methods (N+1 risk)"
  entry: drf-lint
  language: python
  files: "serializers\\.py$"
  # The checker builds one project-wide index per invocation, so parallel
  # invocations would each build their own.
  require_serial: true
  additional_dependencies:
  - mitol-drf-lint
- id: dependency-floors
  name: Dependency floors
  description: "Checks that manifests and the lockfile enforce declared floors"
  entry: dependency-floors check
  language: python
  files: "^(pyproject\\.toml|uv\\.lock|.*/pyproject\\.toml)$"
  # The check reads the whole repository — every manifest against one
  # lockfile — so the changed paths only decide whether it runs, not what
  # it looks at.
  pass_filenames: false
  additional_dependencies:
  - mitol-dependency-floors
