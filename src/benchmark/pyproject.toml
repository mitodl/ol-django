[project]
name = "mitol-django-benchmark"
version = "2026.9.24"
description = "Production-shaped A/B benchmarking harness for Django and DRF endpoints"
authors = [
    { name = "MIT Open Learning Engineering", email = "odl-devops@mit.edu" }
]
license = "BSD-3-Clause"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "django>=4.2",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
]

[project.optional-dependencies]
# The wall-clock and trace passes prefer DRF's APIClient. Without it they fall
# back to django.test.Client, which cannot force_authenticate.
drf = ["djangorestframework>=3.14"]
# Declarative seed steps of kind "factory" go through factory-boy.
factories = ["factory-boy>=3.2"]
# Span sources for the trace pass. Without these the trace step still runs but
# captures nothing, which is why it says so rather than reporting zero.
django = ["opentelemetry-instrumentation-django[asgi]>=0.50b0"]
postgres = [
    "opentelemetry-instrumentation-psycopg>=0.50b0",
    "psycopg[c]>=3.2.4",
]
postgres2 = ["opentelemetry-instrumentation-psycopg2>=0.50b0"]

[project.scripts]
ol-benchmark = "mitol.benchmark.cli:main"

[project.urls]
Repository = "https://github.com/mitodl/ol-django"

[tool.bumpver]
current_version = "2026.9.24"
version_pattern = "YYYY.MM.DD[.INC0]"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"mitol/benchmark/__init__.py" = [
    '__version__ = "{version}"',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["CHANGELOG.md", "README.md", "AGENTS.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["CHANGELOG.md", "README.md", "AGENTS.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]
