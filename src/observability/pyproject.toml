[project]
name = "mitol-django-observability"
version = "2026.3.11"
description = "MIT Open Learning Django plugin for OpenTelemetry, structured logging, and alerting"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "mitol-django-common",
    "opentelemetry-api>=1.31.0",
    "opentelemetry-sdk>=1.31.0",
    "opentelemetry-exporter-otlp-proto-http>=1.31.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.31.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
sentry = ["structlog-sentry>=2.0.0"]
celery = [
    # django-structlog provides request-context propagation from web workers
    # to Celery tasks (request_id, user_id, etc.).
    "django-structlog[celery]>=4.0",
    # OTel instrumentation for Celery tasks — auto-discovered by the
    # observability app's entry-point-based auto-instrumentation.
    "opentelemetry-instrumentation-celery>=0.50b0",
]
postgres = [
    # OTel instrumentation for psycopg queries — auto-discovered by the
    # observability app's entry-point-based auto-instrumentation.
    "opentelemetry-instrumentation-psycopg>=0.50b0",
    # The instrumentation targets psycopg 3, and Django's postgresql backend
    # prefers psycopg 3 over psycopg2 whenever it is importable — so installing
    # this extra decides the application's database driver. Pin the compiled
    # binding rather than leaving that to a bare `psycopg`, which resolves to
    # the pure-Python ctypes implementation upstream calls "much slower".
    # Requires a C compiler, Python headers, libpq-dev, and pg_config at build
    # time; ol-python-base provides all four. See README.md if you need
    # psycopg[binary] instead.
    "psycopg[c]>=3.2.4",
]

[tool.bumpver]
current_version = "2026.3.11"
version_pattern = "YYYY.MM.DD[.INC0]"

[tool.bumpver.file_patterns]
"pyproject.toml" = ['version = "{version}"']
"mitol/observability/__init__.py" = ['__version__ = "{version}"']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["CHANGELOG.md", "README.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["CHANGELOG.md", "README.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]
