[project]
name = "mitol-django-payment-gateway"
version = "2026.8.28"
description = "Django application to handle payment processing"
dependencies = [
    # Capped below 0.0.64: 0.0.78 renames
    # Ptsv2paymentsProcessingInformationAuthorizationOptionsInitiatorMerchantInitiatedTransaction
    # to ProcessingInfoAuthorizationOptionsInitiatorMerchantInitiatedTransaction. The library
    # source does not touch that class, but the SDK gives no deprecation window for such
    # renames, so take the bump deliberately rather than via a lockfile refresh.
    "cybersource-rest-client-python>=0.0.59,<0.0.64",
    "django-stubs>=1.13.1",
    "django>=4.2",
    "mitol-django-common",
    "stripe>=15.3.0",
]
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"

[tool.bumpver]
current_version = "2026.8.28"
version_pattern = "YYYY.MM.DD[.INC0]"

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"mitol/payment_gateway/__init__.py" = [
    '__version__ = "{version}"',
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["CHANGELOG.md", "README.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
include = ["CHANGELOG.md", "README.md", "py.typed", "**/*.py"]
exclude = ["BUILD", "pyproject.toml"]
